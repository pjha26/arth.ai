name: arthai-staging
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: arthai_staging
      POSTGRES_USER: arthai
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Run npm run staging:init first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthai -d arthai_staging"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${STAGING_REDIS_PASSWORD:?Run npm run staging:init first}"]
    environment:
      REDISCLI_AUTH: ${STAGING_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  ml:
    build:
      context: ./ml
    profiles: ["ml"]
    ports:
      - "127.0.0.1:58001:8001"
volumes:
  staging-db:
